name: Build How Soon

# Builds a standalone app for Windows, macOS and Linux on every push to main,
# then publishes them as the GitHub release named after APP_VERSION in howsoon.py.
# To ship a new version: bump APP_VERSION and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install -r requirements-build.txt

      - name: Embed the UI
        run: python build.py

      - name: Build (Windows)
        if: matrix.name == 'windows'
        run: >
          pyinstaller --noconfirm --onefile --windowed --uac-admin
          --name HowSoon --icon assets/howsoon.ico
          dist/HowSoon/howsoon.py
          && Compress-Archive -Path dist/HowSoon.exe -DestinationPath HowSoon-windows.zip

      - name: Build (macOS)
        if: matrix.name == 'macos'
        run: |
          pyinstaller --noconfirm --windowed --name "How Soon" --icon assets/howsoon.icns \
            --osx-bundle-identifier com.bradleywilliams.howsoon dist/HowSoon/howsoon.py
          ditto -c -k --keepParent "dist/How Soon.app" HowSoon-macos.zip

      - name: Build (Linux)
        if: matrix.name == 'linux'
        run: |
          pyinstaller --noconfirm --onefile --name howsoon dist/HowSoon/howsoon.py
          mkdir -p pkg/HowSoon && cp dist/howsoon pkg/HowSoon/ && cp assets/howsoon-256.png pkg/HowSoon/howsoon.png
          tar -C pkg -czf HowSoon-linux-x86_64.tar.gz HowSoon
          cp dist/HowSoon.zip HowSoon-script.zip

      - uses: actions/upload-artifact@v4
        with:
          name: HowSoon-${{ matrix.name }}
          path: HowSoon-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(grep -m1 '^APP_VERSION' howsoon.py | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: How Soon ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: out/*
          body: |
            | System | Download |
            |---|---|
            | Windows 10 / 11 | `HowSoon-windows.zip` |
            | macOS | `HowSoon-macos.zip` (right-click > Open the first time) |
            | Linux x86_64 | `HowSoon-linux-x86_64.tar.gz` |
            | Any system with Python 3.8+ | `HowSoon-script.zip` |
